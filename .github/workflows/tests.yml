name: tests

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - '*'
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git then prints a multi-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # tests/csiApiSurface.spec.js derives the expected API surface from these protos. Only this
      # submodule: ondewo-proto-compiler is not needed by any test. .gitmodules names it by SSH URL,
      # which a runner without a key cannot clone, so it is fetched over public HTTPS instead.
      - name: Check out the ondewo-csi-api submodule
        run: 'git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init src/ondewo-csi-api'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The suite `make release_tests` runs before anything is published: the auth provider under a 100%
      # line/branch/function coverage gate (the repo is ~95% generated stubs, so the gate is scoped to the
      # HAND-WRITTEN auth/*.js), the mocked example (no live server), the shipped bundle and its API surface
      # derived from the protos, and the release Makefile.
      - name: Unit tests (auth with 100% coverage gate, examples, API surface, release Makefile)
        run: npm test
